[project]
name = "lucky-or-good"
version = "0.1.0"
description = "An honest-by-default harness for LLM-driven trading strategy research."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "xlrd>=2.0.2",
]

[project.scripts]
lucky = "lucky.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# A strategy's identity is its exact bytes (content hash). Never reformat one.
exclude = ["strategies/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The cheat catalogue reads best as one row per cheat.
"tests/test_anticheat.py" = ["E501"]
# SVG/HTML markup in f-strings reads worse when wrapped.
"src/lucky/report.py" = ["E501"]
